name: Feature request
description: Suggest an idea for Dastyare Social CS
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please check existing issues and the
        roadmap before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What is the current pain point?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Any alternative solutions or features you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, or references that help explain the request.
