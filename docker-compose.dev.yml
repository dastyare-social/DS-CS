name: ds-cs-dev

services:
  app:
    image: dastyaresocial/ds-cs:latest
    ports:
      - "8729:8729"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ds_cs
      S3_ENDPOINT: http://rustfs:9000
      BETTER_AUTH_URL: http://localhost:8729
      NEXT_PUBLIC_APP_URL: http://localhost:8729
      # CI: "true"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8729/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    command: sh -c "npm run generate:config && npm run generate:icons && npm run db:migrate && npm run bootstrap:admin && npm run upload:emojis && npx next dev -p 8729"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ds_cs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ds_cs"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # minio:
  #   image: minio/minio:latest
  #   command: server /data
  #   environment:
  #     MINIO_ROOT_USER: 442c201224d92fbd5df5aa9d
  #     MINIO_ROOT_PASSWORD: ea8d22810ade922c73ada6bc0c446c5de465db49454c02b8
